# Muraqib Nightly Test Runner
#
# Copy to .github/workflows/muraqib-nightly.yml in your project.
# Runs every night at 02:00 UTC (adjust cron to your timezone).
#
# Required secrets:
#   RESEND_API_KEY   — for email alerts (get one at resend.com, free tier works)
#
# Optional:
#   QA_BASE_URL      — overrides baseUrl from muraqib.config.ts

name: Muraqib Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: write is nodig voor de "Trigger Claude fix on failure"-stap hieronder, die een
    # workflow_dispatch aanroept op muraqib-claude-fix.yml — zonder dit faalt die stap met
    # "Resource not accessible by integration" als het repo-brede standaard-token read-only is.
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        env:
          QA_BASE_URL: ${{ secrets.QA_BASE_URL || vars.QA_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npx playwright test --reporter=json,list || echo "tests_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json
          path: test-results/results.json
          retention-days: 30

      - name: Trigger Claude fix on failure
        if: steps.tests.outputs.tests_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/results.json';
            let summary = "Test results JSON not found.";
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              const failed = (data.suites || []).flatMap(s => (s.specs || []).flatMap(sp => sp.tests || []))
                .filter(t => t.status === "failed" || (t.results || []).some(r => r.status === "failed"));
              summary = `${failed.length} test(s) failed.`;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'muraqib-claude-fix.yml',
              ref: context.ref,
              inputs: {
                run_id: String(context.runId),
                summary: summary,
              },
            });

      - name: Fail job if tests failed
        if: steps.tests.outputs.tests_failed == 'true'
        run: exit 1
