# Muraqib Nightly Test Runner
#
# Already wired up, edit muraqib.config.ts, not this file, to point it at
# your project (baseUrl, flows, alerting). Runs every night at 02:00 UTC
# (adjust the cron below for your timezone).
#
# Required secrets:
#   RESEND_API_KEY  , for email alerts (get one at resend.com, free tier works)
#
# Optional:
#   QA_BASE_URL     , overrides baseUrl from muraqib.config.ts

name: Muraqib Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # No push trigger on purpose. The project this template came from had one and
  # removed it: every merge to main kicked off a full 25 to 45 minute Playwright
  # run against production, which costs runner minutes and tells you nothing the
  # nightly schedule will not tell you a few hours later. That lesson never made
  # it back here until now. If you want a run after a deploy, dispatch it.

# Found 2026-09-03: with no concurrency group, a manual dispatch overlapping the
# scheduled run (or two dispatches close together) can produce two nightly runs
# in flight at once. Each failing run independently triggers muraqib-claude-fix.yml,
# which opens its own GitHub Issue for the same underlying failure. Confirmed live
# on this repo: 19 open, never-closed duplicate issues in 4.5 days. cancel-in-progress
# is deliberately false: cancelling the older run would recreate the exact
# "cancelled reads as silence, not failure" bug this project exists to catch,
# queueing is safe here because a nightly run finishing a few minutes late is not
# an incident.
concurrency:
  group: muraqib-nightly
  cancel-in-progress: false

jobs:
  # The runner is a concrete image, not ubuntu-latest. GitHub moves that label
  # to each new Ubuntu LTS, and a Playwright version that does not support the
  # new release yet fails at the browser install, so the nightly would end before
  # its first test and none of the alerts below could fire. Move the pin together
  # with a Playwright upgrade. scripts/check-runner-pin.mjs fails the build if
  # the label comes back.
  test:
    runs-on: ubuntu-24.04
    # This is a hard kill, not a failure. If the runner stops the job here,
    # Playwright writes no report, GitHub records the run as "cancelled", and
    # every step below that keys off `tests_failed` is skipped: no fix PR, no
    # failing job, no email. The run looks like nothing happened.
    #
    # So this number is deliberately NOT the real limit. playwright.config.ts
    # sets globalTimeout below it, which makes Playwright stop itself first,
    # with a report and a non-zero exit, so a slow suite reads as a loud
    # failure instead of silence. This value only exists as the outer backstop
    # for the install and upload steps around the test run.
    #
    # Keep it above globalTimeout. scripts/check-timeout-budget.mjs fails the
    # build if the two ever drift into the wrong order.
    timeout-minutes: 45
    # actions:write is required for the createWorkflowDispatch() call below ,
    # without this explicit grant it 403s on any repo where the default
    # GITHUB_TOKEN permissions are read-only (GitHub's newer repo default).
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        env:
          QA_BASE_URL: ${{ secrets.QA_BASE_URL || vars.QA_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        # No --reporter flag here: it overrides playwright.config.ts's reporter
        # array wholesale, and the CLI-provided "json" reporter has no outputFile,
        # so it writes to stdout instead of test-results/results.json, meaning
        # the artifact upload below finds nothing and the fix workflow's failure
        # details are always empty. Let the config's reporter list run as-is.
        run: npx playwright test || echo "tests_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-json
          path: test-results/results.json
          retention-days: 30

      - name: Trigger Claude fix on failure
        if: steps.tests.outputs.tests_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/results.json';
            let summary = "Test results JSON not found.";
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              // Playwright nests an extra suites layer per test.describe(), so a
              // flat one-level flatMap misses every test inside a describe() and
              // undercounts, down to "0 test(s) failed" in the worst case. This
              // exact bug was already found and fixed with a recursive walk in
              // muraqib-claude-fix.yml (see the "Build issue body" step there) on
              // 2026-08-28, but the fix was never applied here, in the sibling
              // file that computes the short summary text for the same run.
              // Found again 2026-09-03, walk recursively here too.
              const failed = [];
              function walkSuite(suite) {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    if (test.status === "failed" || (test.results || []).some(r => r.status === "failed")) {
                      failed.push(test);
                    }
                  }
                }
                for (const child of suite.suites || []) walkSuite(child);
              }
              (data.suites || []).forEach(walkSuite);
              summary = `${failed.length} test(s) failed.`;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'muraqib-claude-fix.yml',
              ref: context.ref,
              inputs: {
                run_id: String(context.runId),
                summary: summary,
              },
            });

      - name: Fail job if tests failed
        if: steps.tests.outputs.tests_failed == 'true'
        run: exit 1
