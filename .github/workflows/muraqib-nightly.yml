# Muraqib Nightly Test Runner
#
# Already wired up, edit muraqib.config.ts, not this file, to point it at
# your project (baseUrl, flows, alerting). Runs every night at 02:00 UTC
# (adjust the cron below for your timezone).
#
# Required secrets:
#   RESEND_API_KEY  , for email alerts (get one at resend.com, free tier works)
#
# Optional:
#   QA_BASE_URL     , overrides baseUrl from muraqib.config.ts

name: Muraqib Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # No push trigger on purpose. The project this template came from had one and
  # removed it: every merge to main kicked off a full 25 to 45 minute Playwright
  # run against production, which costs runner minutes and tells you nothing the
  # nightly schedule will not tell you a few hours later. That lesson never made
  # it back here until now. If you want a run after a deploy, dispatch it.

jobs:
  test:
    runs-on: ubuntu-latest
    # This is a hard kill, not a failure. If the runner stops the job here,
    # Playwright writes no report, GitHub records the run as "cancelled", and
    # every step below that keys off `tests_failed` is skipped: no fix PR, no
    # failing job, no email. The run looks like nothing happened.
    #
    # So this number is deliberately NOT the real limit. playwright.config.ts
    # sets globalTimeout below it, which makes Playwright stop itself first,
    # with a report and a non-zero exit, so a slow suite reads as a loud
    # failure instead of silence. This value only exists as the outer backstop
    # for the install and upload steps around the test run.
    #
    # Keep it above globalTimeout. scripts/check-timeout-budget.mjs fails the
    # build if the two ever drift into the wrong order.
    timeout-minutes: 45
    # actions:write is required for the createWorkflowDispatch() call below ,
    # without this explicit grant it 403s on any repo where the default
    # GITHUB_TOKEN permissions are read-only (GitHub's newer repo default).
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        env:
          QA_BASE_URL: ${{ secrets.QA_BASE_URL || vars.QA_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        # No --reporter flag here: it overrides playwright.config.ts's reporter
        # array wholesale, and the CLI-provided "json" reporter has no outputFile,
        # so it writes to stdout instead of test-results/results.json, meaning
        # the artifact upload below finds nothing and the fix workflow's failure
        # details are always empty. Let the config's reporter list run as-is.
        run: npx playwright test || echo "tests_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json
          path: test-results/results.json
          retention-days: 30

      - name: Trigger Claude fix on failure
        if: steps.tests.outputs.tests_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/results.json';
            let summary = "Test results JSON not found.";
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              const failed = (data.suites || []).flatMap(s => (s.specs || []).flatMap(sp => sp.tests || []))
                .filter(t => t.status === "failed" || (t.results || []).some(r => r.status === "failed"));
              summary = `${failed.length} test(s) failed.`;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'muraqib-claude-fix.yml',
              ref: context.ref,
              inputs: {
                run_id: String(context.runId),
                summary: summary,
              },
            });

      - name: Fail job if tests failed
        if: steps.tests.outputs.tests_failed == 'true'
        run: exit 1
