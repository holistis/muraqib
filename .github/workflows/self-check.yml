# Muraqib Self-Check
#
# Runs on every push/PR to this repo. Fails the build if any workflow step
# splices a GitHub Actions expression (${{ }}) directly into a script/run
# body instead of passing it through env: — the exact class of bug that
# shipped in this repo's first commit (see SECURITY.md).

name: Muraqib Self-Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run check:workflows
