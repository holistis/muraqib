# Muraqib Self-Check
#
# Runs on every push/PR to this repo. Fails the build if any workflow step
# splices a GitHub Actions expression (${{ }}) directly into a script/run
# body instead of passing it through env:. That is the exact class of bug that
# shipped in this repo's first commit (see SECURITY.md). Also fails if the
# auto-merge-guard job carries a job-level if:, which makes it report SKIPPED
# instead of pass/fail and permanently blocks merging under required-status-
# checks. That exact bug shipped on 2026-08-29 (see SECURITY.md).

name: Muraqib Self-Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run test:scripts
      - run: npm run check:workflows
      - run: npm run check:required-checks
