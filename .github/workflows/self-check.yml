# Muraqib Self-Check
#
# Runs on every push/PR to this repo. Fails the build if any workflow step
# splices a GitHub Actions expression (${{ }}) directly into a script/run
# body instead of passing it through env:. That is the exact class of bug that
# shipped in this repo's first commit (see SECURITY.md). Also fails if the
# auto-merge-guard job carries a job-level if:, which makes it report SKIPPED
# instead of pass/fail and permanently blocks merging under required-status-
# checks. That exact bug shipped on 2026-08-29 (see SECURITY.md). Also fails
# if the nightly's job timeout could hard-kill the run before Playwright stops
# itself, which turns a slow suite into a silent "cancelled" that fires no
# alert at all. That one ran unnoticed for over two months (see LESSONS.md).
# And fails if a notification step could skip itself quietly, which is the same
# bug one layer out: the step runs, decides it cannot send, and reports success.

name: Muraqib Self-Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run test:scripts
      - run: npm run check:workflows
      - run: npm run check:required-checks
      - run: npm run check:timeout-budget
      - run: npm run check:alerting

  # Runs the published Action against this repo, using the copy in this branch
  # rather than a released one. Without this the action.yml is only checked by
  # reading it, and an action nobody runs is exactly the kind of thing that is
  # broken on the day someone else first tries it.
  action-works:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          dir: "."
