# Muraqib Auto-Merge Guard
#
# A second, code-based line of defense behind the "never auto-merge
# payment/auth/migration/secrets changes" instruction already given to
# Claude in muraqib-claude-fix.yml. That instruction is text a model reads
# and could misjudge; this check inspects the actual changed files on any
# PR that has auto-merge enabled, and forcibly disables it if a sensitive
# path is touched, independent of what the PR author (human or Claude)
# decided.
#
# Uses pull_request_target, NOT pull_request. On a plain `pull_request`
# trigger, GitHub reads the workflow *definition* from the PR branch's own
# merge of head+base, meaning a PR that weakens this guard (empties the
# pattern, disables the job) and touches a sensitive path in the same diff
# would be checked against its own already-weakened copy of the rules,
# defeating the entire point. `pull_request_target` always reads the
# workflow from the base branch, which the PR cannot alter. Because of
# that, this workflow must never check out or execute anything from the
# PR's own ref, it only calls the GitHub API for a list of changed
# filenames (see scripts/check-sensitive-paths.mjs), never `git diff`
# against a checked-out PR head.
#
# REQUIRED SETUP beyond this file: add "Muraqib Auto-Merge Guard / guard"
# as a required status check in this repo's branch protection rules for
# main. Without that, this job runs asynchronously and GitHub's native
# auto-merge can complete before it does, a required status check is the
# only way to make GitHub wait for this job's result before merging.
#
# The auto-merge check is done with an if: on individual STEPS, not on the
# job itself. A job-level if: that evaluates to false makes the whole check
# run report as "skipped", and GitHub's required-status-checks feature does
# not treat a skipped check as satisfying the requirement, it leaves the PR
# permanently blocked from merging even with no auto-merge involved at all.
# Gating at the step level means the job always finishes with a real
# success/failure conclusion, whether or not auto-merge is on.
#
# Customize which paths count as sensitive via the MURAQIB_SENSITIVE_PATHS
# repo variable (Settings > Secrets and variables > Actions > Variables
# tab), a single case-insensitive regex. An invalid pattern fails CLOSED
# (treated as a match) rather than silently checking nothing, see
# scripts/check-sensitive-paths.mjs.

name: Muraqib Auto-Merge Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, auto_merge_enabled, ready_for_review]

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Report no-op when auto-merge is not enabled
        if: github.event.pull_request.auto_merge == null
        run: echo "Auto-merge is not enabled on this PR, nothing to guard."

      # Default checkout ref for pull_request_target is the BASE branch,
      # not the PR head, this is what keeps the guard's own code trusted.
      - uses: actions/checkout@v4
        if: github.event.pull_request.auto_merge != null

      - name: Check changed files against the sensitive-paths guard
        if: github.event.pull_request.auto_merge != null
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MURAQIB_SENSITIVE_PATHS: ${{ vars.MURAQIB_SENSITIVE_PATHS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-sensitive-paths.mjs
